[package]
name = "imcat"
version = "2.0.0"
edition = "2024"
description = "Preview any size image in a terminal window"
license = "CC0-1.0"
repository = "https://github.com/stolk/imcat"
readme = "README.md"

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "hdr", "pnm", "webp", "tiff", "qoi", "ico", "dds", "ff"] }
terminal_size = "0.4.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
